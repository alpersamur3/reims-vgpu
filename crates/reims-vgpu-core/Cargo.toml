[package]
name = "reims-vgpu-core"
description = "All of the library's behaviour, generic over the platform; links no Apple framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# core::testkit and testkit::capture outside this crate's own unit tests (architecture 13.2).
testkit = []
# The guest is arm64, with 16 KiB pages, whatever the build's architecture: an x86-64 build that
# serves an arm64 guest under TCG. Without it an x86-64 build serves x86-64 guests with 4 KiB
# pages (build.rs sets `cfg(apv_guest_4k)`); on an aarch64 build it changes nothing. It switches
# the guest rather than adding to it: `--all-features` on x86-64 selects the arm64 guest.
guest-arm64 = []

# Architecture 2.2: no objc2, block2, dispatch2, mach2 or libc here.
[dependencies]
parking_lot.workspace = true
zerocopy.workspace = true
bitflags.workspace = true
log.workspace = true

[target.'cfg(loom)'.dependencies]
loom.workspace = true

[lints]
workspace = true
