[package]
name = "reims-vgpu"
description = "The public Rust API of the reims virtual GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["macos-sdl"]
# SDL3's window on macOS, the window crate's `macos-sdl`, which `REIMS_VGPU_WINDOW_IMPL=sdl` opens
# in place of AppKit's. Without it the macOS library has no SDL, and its windows are AppKit's.
# Linux's window is SDL3's whatever this says.
macos-sdl = ["reims-vgpu-window/macos-sdl"]
# Tests: the core objects behind the public handles (`core()`), and core's testkit.
testkit = ["reims-vgpu-core/testkit"]
# The Vulkan platform (architecture 2.2): `VulkanPlatform` as an `ApiPlatform`, which the C API's
# own `vulkan` feature makes its platform. Off by default on macOS, where the Metal platform is the
# product; on Linux the library builds only with it (`lib.rs`).
vulkan = ["dep:reims-vgpu-vulkan"]
# Core's `guest-arm64`: the guest is arm64, with 16 KiB pages, on any build.
guest-arm64 = ["reims-vgpu-core/guest-arm64"]

[dependencies]
reims-vgpu-core.workspace = true
reims-vgpu-window.workspace = true
reims-vgpu-vulkan = { workspace = true, optional = true }
# A window frame that fails, or a window that gets no sink (`window::vulkan`).
log.workspace = true

# The Metal platform, the product on macOS, and its window's drawable (`window::metal::MetalSink`,
# `window::vulkan`'s macOS sink).
[target.'cfg(target_os = "macos")'.dependencies]
reims-vgpu-metal.workspace = true
objc2.workspace = true
objc2-metal.workspace = true
objc2-quartz-core = { workspace = true, features = ["CAMetalLayer", "objc2-metal"] }

[dev-dependencies]
reims-vgpu-core = { workspace = true, features = ["testkit"] }

# The guest's RAM as a host maps it on Linux, a shared mapping of a file (`platform::tests`).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

# A swapchain over a layer of the test's own on macOS, its surface made with ash's types
# (`window::vulkan`'s tests).
[target.'cfg(target_os = "macos")'.dev-dependencies]
ash.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-quartz-core = { workspace = true, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
] }

[lints]
workspace = true
